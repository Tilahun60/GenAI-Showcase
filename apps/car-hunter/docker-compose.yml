services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: carhunter
      POSTGRES_PASSWORD: carhunter
      POSTGRES_DB: carhunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carhunter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  car-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql+asyncpg://carhunter:carhunter@db:5432/carhunter
    command: ["python", "-m", "src.main", "run"]
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
