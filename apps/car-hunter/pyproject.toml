[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-hunter"
version = "1.0.0"
description = "Automated Polish used-car market monitoring system"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "scrapy>=2.11",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.3",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
car-hunter = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
